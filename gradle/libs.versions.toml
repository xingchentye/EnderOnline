# 版本目录（Gradle Version Catalog）—— 依赖与版本的唯一来源
#
# 规则（见 docs/01-architecture-plan.md §6）：
#   1. 任何依赖坐标与版本号只允许写在本文件里；各 build.gradle 必须通过 libs.* 引用。
#   2. 守卫 check-dependency-single-source.ps1 会拦截在 build.gradle 里硬编码的坐标；
#      本文件落地后该守卫的基线应降为 0。
#   3. 升级依赖时只改这里，改完跑一次两端构建。
#
# 加载器版本（minecraft / forge / neoforge / parchment）刻意保留在各自模块的
# gradle.properties 里：它们由各自插件的约定读取（如 NeoGradle 的 neoForge.version），
# 强行搬进版本目录会让构建脚本与插件约定互相打架。

[versions]
# 第三方库：三处模块共用
java-websocket = "1.5.4"
commons-compress = "1.26.0"
gson = "2.10.1"
slf4j = "2.0.9"

# 测试
junit = "5.10.0"

[libraries]
# ---- 运行期依赖 ----
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# ---- 测试依赖 ----
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
# ender_core 的运行期依赖集合
core-runtime = ["java-websocket", "commons-compress", "gson", "slf4j-api"]
